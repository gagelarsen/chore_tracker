name: Chorez
options:
  bundleIdPrefix: com.glarsen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Chorez:
    type: application
    platform: iOS
    sources:
      - Chorez
    resources:
      - Chorez/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez
        INFOPLIST_FILE: Chorez/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  ChorezTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChorezTests
    dependencies:
      - target: Chorez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez.tests
        GENERATE_INFOPLIST_FILE: YES

  ChorezUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ChorezUITests
    dependencies:
      - target: Chorez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Chorez

schemes:
  Chorez:
    build:
      targets:
        Chorez: all
        ChorezTests: [test]
        ChorezUITests: [test]
    test:
      targets:
        - ChorezTests
        - ChorezUITests
      gatherCoverageData: true
      coverageTargets:
        - Chorez
    run:
      config: Debug
    archive:
      config: Release
