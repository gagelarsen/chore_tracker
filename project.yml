name: Chorez
options:
  bundleIdPrefix: com.glarsen
  deploymentTarget:
    iOS: "17.5"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Team ID is sourced from .chorez-team.local (gitignored). Empty
    # when the file is missing — CI builds with CODE_SIGNING_ALLOWED=NO
    # so an empty value is fine there. Real-device + CloudKit builds
    # require the team ID.
    DEVELOPMENT_TEAM: ${CHOREZ_TEAM_ID}

targets:
  Chorez:
    type: application
    platform: iOS
    sources:
      - Chorez
    resources:
      - Chorez/Assets.xcassets
    entitlements:
      path: Chorez/Chorez.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.glarsen.chorez
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.glarsen.chorez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez
        INFOPLIST_FILE: Chorez/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Chorez/Chorez.entitlements

  ChorezTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChorezTests
    dependencies:
      - target: Chorez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez.tests
        GENERATE_INFOPLIST_FILE: YES

  ChorezUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ChorezUITests
    dependencies:
      - target: Chorez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glarsen.chorez.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Chorez

schemes:
  Chorez:
    build:
      targets:
        Chorez: all
        ChorezTests: [test]
        ChorezUITests: [test]
    test:
      targets:
        - ChorezTests
        - ChorezUITests
      gatherCoverageData: true
      coverageTargets:
        - Chorez
    run:
      config: Debug
    archive:
      config: Release
